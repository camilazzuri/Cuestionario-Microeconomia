<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario de Microeconomía - UTN FRC</title>
  <style>
    :root{
      --bg:#062918;
      --card:#0b3d24;
      --hov:#125433;
      --bd:#1d7548;
      --bd2:#00e65b;
      --pri:#00ff66;
      --prib:#66ff99;
      --pril:rgba(0,255,102,.18);
      --fuc:#ff007f;
      --fucb:#ff4da6;
      --ok:#00ff66;
      --okb:rgba(0,255,102,.16);
      --bad:#ff2a5f;
      --badb:rgba(255,42,95,.18);
      --warn:#facc15;
      --warnb:rgba(250,204,21,.16);
      --star:#fde047;
      --tx:#f0fdf4;
      --mut:#a7f3d0;
      --dim:#6ee7b7;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#0a3b23 0%,var(--bg) 65%);color:var(--tx);line-height:1.6;min-height:100vh;padding-bottom:40px}
    .container{max-width:960px;margin:0 auto;padding:20px}
    header{text-align:center;margin-bottom:22px;padding-bottom:15px;border-bottom:1px solid var(--bd)}
    h1{font-size:2em;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px}
    h1 span{color:var(--pri);text-shadow:0 0 14px rgba(0,255,102,.55)}
    .subtitle{color:var(--mut);margin-top:5px}
    .pills{display:flex;justify-content:center;gap:12px;margin-top:12px;font-size:.88em;flex-wrap:wrap}
    .pill{background:var(--card);border:1px solid var(--bd);padding:4px 12px;border-radius:20px;color:var(--mut)}
    .pill strong{color:var(--pri)}
    .shortcuts{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:rgba(0,255,102,.09);border:1px dashed rgba(0,255,102,.45);border-radius:10px;padding:8px 14px;margin-bottom:20px;font-size:.85em;color:#dcfce7}
    .kbd{background:var(--bg);border:1px solid var(--bd2);box-shadow:0 2px 0 var(--bd);padding:2px 7px;border-radius:5px;font-family:monospace;color:var(--pri);font-weight:700}
    .settings{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 22px;margin-bottom:25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;box-shadow:0 4px 20px rgba(0,0,0,.35)}
    .toggles{display:flex;gap:20px;flex-wrap:wrap}
    .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-weight:600;font-size:.92em}
    .switch{position:relative;width:46px;height:24px}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#062918;transition:.25s;border-radius:24px;border:1px solid var(--bd);cursor:pointer}
    .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#a7f3d0;transition:.25s;border-radius:50%}
    input:checked+.slider{background:var(--pri);border-color:var(--prib);box-shadow:0 0 12px rgba(0,255,102,.65)}
    input:checked+.slider:before{transform:translateX(22px);background:#031c0e}
    .section-title{font-size:1.2em;margin:25px 0 12px;font-weight:700;color:#ecfdf5}
    .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:25px}
    .menu-btn{padding:14px 18px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;cursor:pointer;font-size:.95em;font-weight:600;transition:.2s;font-family:inherit}
    .menu-btn:hover{background:var(--hov);border-color:var(--pri);transform:translateY(-2px);box-shadow:0 0 18px rgba(0,255,102,.32)}
    
    /* Botón Simulacro: ÚNICO botón en Fucsia Flúo */
    .exam-btn{
      grid-column:1/-1;
      background:linear-gradient(135deg,#ff007f,#ff1e8e 50%,#e60073);
      border:1px solid #ff80bf;
      font-size:1.2em;
      padding:18px;
      font-weight:800;
      color:#ffffff;
      text-shadow:0 1px 4px rgba(0,0,0,.35);
      box-shadow:0 0 24px rgba(255,0,127,.65),0 4px 16px rgba(255,0,127,.4);
    }
    .exam-btn:hover{
      background:linear-gradient(135deg,#ff1a8c,#ff4da6);
      border-color:#ffb3d9;
      box-shadow:0 0 34px rgba(255,0,127,.9),0 6px 20px rgba(255,0,127,.55);
    }

    /* Botón Todas las preguntas: Verde Flúo */
    .all-btn{
      grid-column:1/-1;
      background:linear-gradient(135deg,#00e65b,#00ff66);
      border:1px solid #80ffb3;
      font-size:1.15em;
      padding:16px;
      font-weight:800;
      color:#031c0e;
      box-shadow:0 0 22px rgba(0,255,102,.5),0 4px 15px rgba(0,255,102,.3);
    }
    .all-btn:hover{
      background:linear-gradient(135deg,#00ff66,#66ff99);
      border-color:#b3ffd1;
      box-shadow:0 0 30px rgba(0,255,102,.8),0 6px 18px rgba(0,255,102,.45);
    }

    .marked-btn{border-color:var(--warn);color:var(--star)}
    .retry-btn{border-color:var(--bad);color:#ff809f}
    .menu-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
    #landing,#results{text-align:center}
    #landing .section-title{text-align:left}
    #quiz-area,#results{display:none}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
    .timer{background:rgba(0,255,102,.15);border:1px solid var(--pri);color:var(--pri);padding:4px 12px;border-radius:20px;font-weight:700;font-family:monospace;margin-left:10px;box-shadow:0 0 10px rgba(0,255,102,.25)}
    .top-btn{background:var(--card);border:1px solid var(--bd);color:var(--mut);padding:6px 14px;border-radius:8px;font-size:.85em;cursor:pointer;font-weight:600;font-family:inherit;margin-left:8px}
    .top-btn:hover{background:var(--hov);border-color:var(--pri);color:var(--tx)}
    .pbar{background:var(--card);border:1px solid var(--bd);border-radius:10px;height:8px;margin-bottom:20px;overflow:hidden}
    .pbar div{background:linear-gradient(90deg,#00cc52,#00ff66);box-shadow:0 0 12px rgba(0,255,102,.7);height:100%;width:0;transition:width .3s}
    .palette{display:none;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:15px;background:var(--card);border:1px
